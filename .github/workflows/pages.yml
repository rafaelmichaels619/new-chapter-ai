# Publishes the static site to GitHub Pages on every push to main.
# Live URL: https://rafaelmichaels619.github.io/new-chapter-ai/
#
# The owner turns this on once: Settings → Pages → Source: GitHub Actions.
# See the README for the full steps.

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html privacy.html terms.html favicon.svg .nojekyll _site/
          cp -r css js data assets _site/
          test -f _site/index.html
          test -f _site/privacy.html
          test -f _site/terms.html
          test -f _site/css/styles.css
          test -f _site/js/main.js
          test -f _site/data/media.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
