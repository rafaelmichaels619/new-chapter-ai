# Publishes the static site to GitHub Pages on every push to main.
# Live URL: https://rafaelmichaels619.github.io/new-chapter-ai/
#
# The owner turns this on once: Settings → Pages → Source: GitHub Actions.
# See the README for the full steps.

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html privacy.html terms.html 404.html robots.txt sitemap.xml favicon.svg apple-touch-icon.png .nojekyll _site/
          cp -r css js data assets gild _site/
          test -f _site/index.html
          test -f _site/privacy.html
          test -f _site/terms.html
          test -f _site/404.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/assets/images/og-share.jpg
          test -f _site/css/styles.css
          test -f _site/js/main.js
          test -f _site/data/media.js
          test -f _site/assets/videos/real-estate-tour.mp4
          test -f _site/assets/images/real-estate-tour-poster.jpg
          test -f _site/assets/videos/lifestyle-reel.mp4
          test -f _site/assets/images/lifestyle-reel-poster.jpg
          test -f _site/gild/index.html
          test -f _site/gild/privacy.html
          test -f _site/gild/terms.html
          test -f _site/gild/css/styles.css
          test -f _site/gild/js/config.js
          test -f _site/gild/favicon.svg
          test -f _site/gild/assets/og.png

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
